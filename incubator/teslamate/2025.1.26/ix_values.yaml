cnpg:
  main:
    cluster:
      initdb:
        postInitApplicationSQL:
        - ALTER USER teslamate WITH SUPERUSER
    database: teslamate
    enabled: true
    user: teslamate
configmap:
  datasource:
    data:
      datasourceteslamatepsql.yaml: "apiVersion: 1\ndatasources:\n- name: TeslaMate\n\
        \  type: postgres\n  uid: TeslaMate\n  url: {{ printf \"%s.%s:5432\" (.Values.cnpg.main.creds.host\
        \ | trimAll \"\\\"\") .Release.Namespace }}\n  access: proxy\n  user: {{ .Values.cnpg.main.user\
        \ }}\n  secureJsonData:\n    password: {{ .Values.cnpg.main.creds.password\
        \ | default \"na\" }}\n  jsonData:\n    database: {{ .Values.cnpg.main.database\
        \ }}\n    sslmode: 'disable' # disable/require/verify-ca/verify-full\n   \
        \ maxOpenConns: 100 # Grafana v5.4+\n    maxIdleConns: 100 # Grafana v5.4+\n\
        \    maxIdleConnsAuto: true # Grafana v9.5.1+\n    connMaxLifetime: 14400\
        \ # Grafana v5.4+\n    postgresVersion: 1500 # 903=9.3, 904=9.4, 905=9.5,\
        \ 906=9.6, 1000=10\n    timescaledb: false"
    enabled: true
    labels:
      grafana_datasources: '1'
image:
  pullPolicy: IfNotPresent
  repository: teslamate/teslamate
  tag: latest
portal:
  open:
    enabled: true
securityContext:
  container:
    readOnlyRootFilesystem: false
service:
  main:
    ports:
      main:
        port: 4000
        protocol: http
workload:
  main:
    podSpec:
      containers:
        main:
          env:
            DATABASE_HOST:
              secretKeyRef:
                key: host
                name: cnpg-main-urls
            DATABASE_NAME: '{{ .Values.cnpg.main.database }}'
            DATABASE_PASS:
              secretKeyRef:
                key: password
                name: cnpg-main-user
            DATABASE_USER: '{{ .Values.cnpg.main.user }}'
            DISABLE_MQTT: true
            ENCRYPTION_KEY:
              secretKeyRef:
                key: TESLAMATE_ENCRYPTION_KEY
                name: teslamate-secrets
            MQTT_HOST: ''
            MQTT_PASSWORD: ''
            MQTT_PORT: 1883
            MQTT_USERNAME: ''
    replicas: 1
    strategy: RollingUpdate
