image:
  pullPolicy: IfNotPresent
  repository: stonith404/pingvin-share
  tag: latest
persistence:
  data:
    enabled: true
    mountPath: /opt/app/backend/data
  image:
    enabled: true
    mountPath: /opt/app/frontend/public/img
portal:
  open:
    enabled: true
securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsGroup: 0
    runAsNonRoot: false
    runAsUser: 0
service:
  main:
    ports:
      main:
        port: 3333
        protocol: http
        targetPort: 3333
