image:
  pullPolicy: Always
  repository: ghcr.io/neggles/sd-webui-docker
  tag: latest
persistence:
  data:
    enabled: true
    mountPath: /data
  output:
    enabled: true
    mountPath: /output
portal:
  open:
    enabled: true
service:
  main:
    enabled: true
    ports:
      main:
        enabled: true
        port: 7860
        targetPort: 7860
vladImage:
  pullPolicy: Always
  repository: ghcr.io/neggles/sd-webui-docker
  tag: vlad@sha256:5fa3b1a94721415c887bc7f8f1b7edd3ab62408a54eb988d242d20e447fca93d
workload:
  main:
    podSpec:
      containers:
        main:
          args:
          - --skip-version-check
          env:
            PYTHONUNBUFFERED: '1'
          imageSelector: image
          probes:
            liveness:
              enabled: true
            readiness:
              enabled: true
            startup:
              enabled: true
