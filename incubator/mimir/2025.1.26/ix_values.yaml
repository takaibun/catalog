configmap:
  grafana-datasource:
    data:
      datasource.yaml: "apiVersion: 1\ndatasources:\n- name: Mimir\n  type: prometheus\n\
        \  uid: {{ .Values.grafana.datasource.uid | default \"prometheus\" }}\n  url:\
        \ http://{{ if ne .Release.Name \"mimir\" }}{{ .Release.Name }}-{{ end }}mimir-nginx.{{\
        \ .Release.Namespace }}/prometheus\n  access: proxy\n  isDefault: {{ .Values.grafana.datasource.default\
        \ | default true }}\n  jsonData:\n    httpMethod: {{ .Values.grafana.datasource.httpMethod\
        \ | default \"POST\" }}\n    timeInterval: {{ .Values.grafana.datasource.scrapeInterval\
        \ | default \"30s\" }}\n    {{- if .Values.grafana.datasource.timeout }}\n\
        \    timeout: {{ .Values.grafana.datasource.timeout }}\n    {{- end }}"
    enabled: '{{ if .Values.grafana.datasource.enabled }}true{{ else }}false{{ end
      }}'
    labels:
      grafana_datasources: '1'
grafana:
  datasource:
    default: true
    enabled: true
    httpMethod: POST
    scrapeInterval: 30s
    uid: prometheus
image:
  pullPolicy: IfNotPresent
  repository: tccr.io/truecharts/scratch
  tag: latest
kps:
  alertmanager:
    enabled: false
  coreDns:
    enabled: true
  crds:
    enabled: false
  defaultRules:
    create: true
  global:
    rbac:
      create: true
  grafana:
    defaultDashboardsEnabled: true
    enabled: false
    forceDeployDashboards: true
  kubeApiServer:
    enabled: true
  kubeControllerManager:
    enabled: true
  kubeDns:
    enabled: false
  kubeEtcd:
    enabled: true
  kubeProxy:
    enabled: false
  kubeScheduler:
    enabled: true
  kubeStateMetrics:
    enabled: true
  kubelet:
    enabled: true
  kubernetesServiceMonitors:
    enabled: true
  nodeExporter:
    enabled: true
  prometheus:
    enabled: false
  prometheus-windows-exporter:
    prometheus:
      monitor:
        enabled: false
  prometheusOperator:
    enabled: false
  thanosRuler:
    enabled: false
  windowsMonitoring:
    enabled: false
mimir:
  admin-cache:
    enabled: true
    replicas: 2
  alertmanager:
    persistentVolume:
      enabled: true
    replicas: 2
    resources:
      limits:
        cpu: 1.4
        memory: 1.4Gi
      requests:
        cpu: 20m
        memory: 10Mi
    statefulSet:
      enabled: true
  chunks-cache:
    enabled: true
    replicas: 2
    resources:
      requests:
        cpu: 20m
        memory: 10Mi
  compactor:
    persistentVolume:
      size: 20Gi
    resources:
      limits:
        cpu: 1.4
        memory: 2.1Gi
      requests:
        cpu: 20m
        memory: 10Mi
  distributor:
    replicas: 2
    resources:
      limits:
        cpu: 3.5
        memory: 5.7Gi
      requests:
        cpu: 20m
        memory: 10Mi
  index-cache:
    enabled: true
    replicas: 3
  ingester:
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchExpressions:
            - key: target
              operator: In
              values:
              - ingester
          topologyKey: kubernetes.io/hostname
        - labelSelector:
            matchExpressions:
            - key: app.kubernetes.io/component
              operator: In
              values:
              - ingester
          topologyKey: kubernetes.io/hostname
    persistentVolume:
      size: 50Gi
    replicas: 3
    resources:
      limits:
        cpu: 5
        memory: 12Gi
      requests:
        cpu: 20m
        memory: 10Mi
    topologySpreadConstraints: {}
    zoneAwareReplication:
      topologyKey: kubernetes.io/hostname
  metaMonitoring:
    dashboards:
      annotations: {}
      enabled: true
    grafanaAgent:
      enabled: true
      installOperator: false
      metrics:
        remote:
          headers: {}
          url: http://{{ if ne .Release.Name "mimir" }}{{ .Release.Name }}-{{ end
            }}mimir-nginx.{{ .Release.Namespace }}/prometheus
        scrapeK8s:
          enabled: false
    serviceMonitor:
      enabled: true
  metadata-cache:
    enabled: true
  minio:
    enabled: true
  nginx:
    replicas: 1
    resources:
      limits:
        cpu: 1.4
        memory: 731Mi
      requests:
        cpu: 20m
        memory: 10Mi
  overrides_exporter:
    replicas: 1
    resources:
      limits:
        cpu: 100m
        memory: 128Mi
      requests:
        cpu: 20m
        memory: 10Mi
  querier:
    replicas: 1
    resources:
      limits:
        cpu: 2.8
        memory: 5.6Gi
      requests:
        cpu: 20m
        memory: 10Mi
  query_frontend:
    replicas: 1
    resources:
      limits:
        cpu: 2.8
        memory: 2.8Gi
      requests:
        cpu: 20m
        memory: 10Mi
  results-cache:
    enabled: true
  ruler:
    replicas: 1
    resources:
      limits:
        cpu: 1.4
        memory: 2.8Gi
      requests:
        cpu: 20m
        memory: 10Mi
  store_gateway:
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchExpressions:
            - key: target
              operator: In
              values:
              - store-gateway
          topologyKey: kubernetes.io/hostname
        - labelSelector:
            matchExpressions:
            - key: app.kubernetes.io/component
              operator: In
              values:
              - store-gateway
          topologyKey: kubernetes.io/hostname
    persistentVolume:
      size: 10Gi
    replicas: 3
    resources:
      limits:
        cpu: 1.4
        memory: 2.1Gi
      requests:
        cpu: 20m
        memory: 10Mi
    topologySpreadConstraints: {}
    zoneAwareReplication:
      topologyKey: kubernetes.io/hostname
portal:
  open:
    enabled: false
service:
  main:
    enabled: false
    ports:
      main:
        enabled: false
workload:
  main:
    enabled: false
    podSpec:
      containers:
        main:
          enabled: false
