image:
  pullPolicy: IfNotPresent
  repository: tccr.io/tccr/scratch
  tag: latest
localpv-provisioner:
  analytics:
    enabled: true
    pingInterval: 24h
  enabled: true
  fullnameOverride: ''
  helperPod:
    image:
      pullPolicy: IfNotPresent
      registry: ''
      repository: openebs/linux-utils
      tag: 4.0.0
  hostpathClass:
    basePath: ''
    enabled: true
    ext4Quota:
      enabled: false
      hardLimitGrace: 0%
      softLimitGrace: 0%
    isDefaultClass: false
    name: openebs-hostpath
    nodeAffinityLabels: []
    reclaimPolicy: Delete
    xfsQuota:
      enabled: false
      hardLimitGrace: 0%
      softLimitGrace: 0%
  imagePullSecrets: null
  localpv:
    affinity: {}
    annotations: {}
    basePath: /var/openebs/local
    enableLeaderElection: true
    enabled: true
    healthCheck:
      initialDelaySeconds: 30
      periodSeconds: 60
    image:
      pullPolicy: IfNotPresent
      registry: null
      repository: openebs/provisioner-localpv
      tag: 4.0.0
    name: localpv-provisioner
    nodeSelector: {}
    podAnnotations: {}
    podLabels:
      name: openebs-localpv-provisioner
    privileged: true
    replicas: 1
    resources: null
    securityContext: {}
    tolerations: []
    updateStrategy:
      type: RollingUpdate
  nameOverride: ''
  podSecurityContext: {}
  rbac:
    create: true
  serviceAccount:
    annotations: {}
    create: true
    name: null
lvm-localpv:
  crd:
    enableInstall: false
    volumeSnapshot: false
  enabled: false
portal:
  open:
    enabled: false
service:
  main:
    enabled: false
    ports:
      main:
        enabled: false
volumeSnapshotClass:
  zfspv:
    deletionPolicy: Delete
    driver: zfs.csi.openebs.io
    enabled: false
    isDefault: false
workload:
  main:
    enabled: false
zfs-localpv:
  crd:
    enableInstall: false
    enabled: false
    volumeSnapshot: false
  crds:
    enableInstall: false
    enabled: false
    volumeSnapshot: false
  enabled: false
