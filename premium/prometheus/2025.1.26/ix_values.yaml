configmap:
  grafana-datasource:
    data:
      datasource.yaml: "apiVersion: 1\ndatasources:\n- name: Prometheus\n  type: prometheus\n\
        \  uid: {{ .Values.grafana.datasource.uid | default \"prometheus\" }}\n  url:\
        \ http://{{ include \"tc.v1.common.lib.chart.names.fullname\" $ }}.{{ include\
        \ \"tc.v1.common.lib.metadata.namespace\" (dict \"rootCtx\" $ \"objectData\"\
        \ . \"caller\" \"Configmap\") }}:{{ .Values.service.main.ports.main.port }}\n\
        \  access: proxy\n  isDefault: {{ .Values.grafana.datasource.default | default\
        \ true }}\n  jsonData:\n    httpMethod: {{ .Values.grafana.datasource.httpMethod\
        \ | default \"POST\" }}\n    timeInterval: {{ .Values.grafana.datasource.scrapeInterval\
        \ | default \"30s\" }}\n    {{- if .Values.grafana.datasource.timeout }}\n\
        \    timeout: {{ .Values.grafana.datasource.timeout }}\n    {{- end }}"
    enabled: '{{ if .Values.grafana.datasource.enabled }}true{{ else }}false{{ end
      }}'
    labels:
      grafana_datasources: '1'
env:
  PROMETHEUS_CONFIG_RELOADER:
    configMapKeyRef:
      key: prometheus-config-reloader
      name: prometheus-operator-config
global:
  labels: {}
grafana:
  datasource:
