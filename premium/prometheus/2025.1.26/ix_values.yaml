    timeoutSeconds: 3
  logFormat: logfmt
  logLevel: info
  nodeAffinityPreset:
    key: ''
    type: ''
    values: []
  nodeSelector: {}
  paused: false
  persistence:
    accessModes:
    - ReadWriteOnce
    enabled: true
    size: 999Gi
    storageClass: ''
  podAffinityPreset: ''
  podAntiAffinityPreset: soft
  podDisruptionBudget:
    enabled: false
    maxUnavailable: ''
    minAvailable: 1
  podMetadata:
    annotations: {}
    labels: {}
  podSecurityContext:
