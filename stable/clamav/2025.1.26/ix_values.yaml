clamav:
  cron_enabled: true
  cron_schedule: '* * * * *'
  date_format: +%m-%d-%Y_%H.%M.%S
  extra_args: ''
  log_file_name: clamscan_report
  report_path: /logs
cronjob:
  annotations: {}
  failedJobsHistoryLimit: 5
  successfulJobsHistoryLimit: 2
image:
  pullPolicy: IfNotPresent
  repository: clamav/clamav
  tag: latest
persistence:
  logs:
    enabled: true
    mountPath: /logs
    targetSelectAll: true
  scandir:
    enabled: true
    mountPath: /scandir
    readOnly: true
    targetSelectAll: true
  sigdatabase:
    enabled: true
    mountPath: /var/lib/clamav
    targetSelectAll: true
portal:
  open:
    enabled: false
securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsGroup: 0
    runAsNonRoot: false
    runAsUser: 0
service:
  main:
    ports:
      main:
        port: 3310
        protocol: http
        targetPort: 3310
  milter:
    enabled: true
    ports:
      milter:
        enabled: true
        port: 7357
        protocol: http
        targetPort: 7357
workload:
  main:
    podSpec:
      containers:
        main:
          env:
            CLAMAV_NO_CLAMD: false
            CLAMAV_NO_FRESHCLAMD: false
            CLAMAV_NO_MILTERD: true
            CLAMD_STARTUP_TIMEOUT: 1800
            FRESHCLAM_CHECKS: 1
          probes:
            liveness:
              command:
              - clamdcheck.sh
              enabled: true
              type: exec
            readiness:
              command:
              - clamdcheck.sh
              enabled: true
              type: exec
            startup:
              command:
              - clamdcheck.sh
              enabled: true
              type: exec
