image:
  pullPolicy: IfNotPresent
  repository: ghcr.io/k8s-at-home/apache-musicindex
  tag: latest
portal:
  open:
    enabled: true
securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsGroup: 0
    runAsNonRoot: false
    runAsUser: 0
service:
  main:
    ports:
      main:
        port: 10006
        protocol: http
        targetPort: 80
