image:
  pullPolicy: IfNotPresent
  repository: tinymediamanager/tinymediamanager
  tag: latest
persistence:
  data:
    enabled: true
    mountPath: /data
  movies:
    enabled: true
    mountPath: /media/movies
  tvshows:
    enabled: true
    mountPath: /media/tvshows
portal:
  open:
    enabled: true
securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsGroup: 0
    runAsNonRoot: false
    runAsUser: 0
service:
  main:
    ports:
      main:
        port: 10179
        targetPort: 4000
workload:
  main:
    podSpec:
      containers:
        main:
          env:
            PASSWORD: ''
