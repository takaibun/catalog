image:
  pullPolicy: IfNotPresent
  repository: lancachenet/lancache-dns
  tag: latest
portal:
  open:
    enabled: false
securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsGroup: 0
    runAsNonRoot: false
    runAsUser: 0
service:
  main:
    ports:
      dns:
        enabled: true
        port: 53
        protocol: udp
        targetPort: 53
      main:
        port: 53
        targetPort: 53
workload:
  main:
    podSpec:
      containers:
        main:
          env:
            CACHE_DOMAINS_BRANCH: master
            CACHE_DOMAINS_REPO: https://github.com/uklans/cache-domains.git
            DISABLE_BLIZZARD: false
            DISABLE_ORIGIN: false
            DISABLE_RIOT: false
            DISABLE_SONY: false
            DISABLE_SQUARE: false
            DISABLE_UPLAY: false
            UPSTREAM_DNS: 1.1.1.1;1.0.0.1
          probes:
            liveness:
              type: tcp
            readiness:
              type: tcp
            startup:
              type: tcp
