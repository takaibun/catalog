image:
  pullPolicy: IfNotPresent
  repository: minio/console
  tag: latest
persistence:
  config:
    enabled: true
    mountPath: /config
  varrun:
    enabled: true
portal:
  open:
    enabled: true
securityContext:
  container:
    readOnlyRootFilesystem: false
service:
  main:
    ports:
      main:
        port: 9090
        targetPort: 9090
workload:
  main:
    podSpec:
      containers:
        main:
          args:
          - server
          env:
            CONSOLE_MINIO_SERVER: ''
            CONSOLE_PBKDF_PASSPHRASE: changeme
            CONSOLE_PBKDF_SALT: changeme
