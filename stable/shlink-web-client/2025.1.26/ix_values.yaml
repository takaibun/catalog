image:
  pullPolicy: IfNotPresent
  repository: shlinkio/shlink-web-client
  tag: latest
portal:
  open:
    enabled: true
securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsGroup: 0
    runAsNonRoot: false
    runAsUser: 0
service:
  main:
    ports:
      main:
        port: 10154
        protocol: http
        targetPort: 80
workload:
  main:
    podSpec:
      containers:
        main:
          env:
            SHLINK_SERVER_API_KEY: ''
            SHLINK_SERVER_NAME: ''
            SHLINK_SERVER_URL: ''
