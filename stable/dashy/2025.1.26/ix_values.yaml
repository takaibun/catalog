dashy:
  configDirectoryHostPath: ''
  configDirectoryHostReadOnly: true
  enabled: false
dashyConfig: {}
image:
  pullPolicy: IfNotPresent
  repository: lissy93/dashy
  tag: latest
persistence:
  icons:
    enabled: true
    mountPath: /app/public/item-icons
portal:
  open:
    enabled: true
securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsGroup: 0
    runAsNonRoot: false
    runAsUser: 0
service:
  main:
    ports:
      main:
        port: 10310
        protocol: http
        targetPort: 8080
workload:
  main:
    podSpec:
      containers:
        main:
          env:
            NODE_ENV: production
          probes:
            liveness:
              custom: true
              enabled: true
              spec:
                exec:
                  command:
                  - node
                  - /app/services/healthcheck
            readiness:
              custom: true
              enabled: true
              spec:
                exec:
                  command:
                  - node
                  - /app/services/healthcheck
            startup:
              custom: true
              enabled: true
              spec:
                exec:
                  command:
                  - node
                  - /app/services/healthcheck
