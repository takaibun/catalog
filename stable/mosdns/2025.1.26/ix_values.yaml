image:
  pullPolicy: IfNotPresent
  repository: 601096721/mosdns
  tag: latest
persistence:
  data:
    enabled: true
    mountPath: /etc/mosdns
portal:
  open:
    enabled: false
securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsGroup: 0
    runAsNonRoot: false
    runAsUser: 0
service:
  main:
    ports:
      dns-upd:
        enabled: true
        port: 53
        protocol: udp
        targetPort: 53
      main:
        port: 53
        targetPort: 53
workload:
  main:
    podSpec:
      containers:
        main:
          probes:
            liveness:
              type: tcp
            readiness:
              type: tcp
            startup:
              type: tcp
