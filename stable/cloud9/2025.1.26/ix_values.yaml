image:
  pullPolicy: IfNotPresent
  repository: ghcr.io/linuxserver/cloud9
  tag: latest
persistence:
  code:
    enabled: true
    mountPath: /code
portal:
  open:
    enabled: true
securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsGroup: 0
    runAsNonRoot: false
    runAsUser: 0
service:
  main:
    ports:
      main:
        port: 10070
        protocol: http
        targetPort: 8000
workload:
  main:
    podSpec:
      containers:
        main:
          env: {}
          probes:
            liveness:
              path: /
              type: http
            readiness:
              path: /
              type: http
            startup:
              path: /
              type: http
