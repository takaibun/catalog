image:
  pullPolicy: IfNotPresent
  repository: ghcr.io/linuxserver/tvheadend
  tag: latest
persistence:
  config:
    enabled: true
    mountPath: /config
  varrun:
    enabled: true
portal:
  open:
    enabled: true
securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsGroup: 0
    runAsNonRoot: false
    runAsUser: 0
service:
  htsp:
    enabled: true
    ports:
      htsp:
        enabled: true
        port: 9982
        targetPort: 9982
  main:
    ports:
      main:
        port: 9981
        targetPort: 9981
workload:
  main:
    podSpec:
      containers:
        main:
          env:
            RUN_OPTS: ''
          probes:
            liveness:
              port: '{{ .Values.service.main.ports.main.port }}'
              type: tcp
            readiness:
              port: '{{ .Values.service.main.ports.main.port }}'
              type: tcp
            startup:
              port: '{{ .Values.service.main.ports.main.port }}'
              type: tcp
