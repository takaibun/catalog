cnpg:
  main:
    database: redmine
    enabled: true
    user: redmine
image:
  pullPolicy: IfNotPresent
  repository: redmine
  tag: latest
persistence:
  data:
    enabled: true
    mountPath: /usr/src/redmine/files
portal:
  open:
    enabled: true
redmine:
  no_db_migrate: false
  plugins_migrate: true
securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsGroup: 999
    runAsUser: 999
  pod:
    fsGroup: 999
service:
  main:
    ports:
      main:
        port: 10171
        targetPort: 3000
workload:
  main:
    podSpec:
      containers:
        main:
          env:
            REDMINE_DB_DATABASE: '{{ .Values.cnpg.main.database }}'
            REDMINE_DB_PASSWORD:
              secretKeyRef:
                key: password
                name: cnpg-main-user
            REDMINE_DB_PORT: '5432'
            REDMINE_DB_POSTGRES:
              secretKeyRef:
                key: host
                name: cnpg-main-urls
            REDMINE_DB_USERNAME: '{{ .Values.cnpg.main.user }}'
            REDMINE_NO_DB_MIGRATE: '{{ ternary "true" "" .Values.redmine.no_db_migrate
              }}'
            REDMINE_PLUGINS_MIGRATE: '{{ ternary "true" "" .Values.redmine.plugins_migrate
              }}'
            REDMINE_SECRET_KEY_BASE:
              secretKeyRef:
                key: REDMINE_SECRET_KEY_BASE
                name: secrets
