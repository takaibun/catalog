image:
  pullPolicy: IfNotPresent
  repository: rmoriz/openra
  tag: latest
persistence: {}
portal:
  open:
    enabled: true
securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsGroup: 0
    runAsUser: 0
service:
  main:
    ports:
      main:
        port: 1234
        protocol: tcp
        targetPort: 1234
workload:
  main:
    podSpec:
      containers:
        main:
          env:
            AdvertiseOnline: 'True'
            Ban: ''
            EnableSingleplayer: 'False'
            ExternalPort: '1234'
            ListenPort: '1234'
            MAP: ''
            MOTD: Have Fun!!
            Mod: ra
            Name: DEDICATED SERVER
            Password: ''
