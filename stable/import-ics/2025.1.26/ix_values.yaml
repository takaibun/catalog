image:
  pullPolicy: IfNotPresent
  repository: vilhjalmr26/import_ics
  tag: latest
persistence:
  config:
    enabled: true
    mountPath: /config
  icsexportfolder:
    enabled: true
    mountPath: /import_ics/ical_export
portal:
  open:
    enabled: false
securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsGroup: 0
    runAsUser: 0
service:
  main:
    enabled: false
    ports:
      main:
        enabled: false
workload:
  main:
    podSpec:
      containers:
        main:
          env:
            CRONTAB_SCHEDULE: 0 0 * * *
            ICS_PASSWORD: ''
            ICS_URL: ''
            ICS_USERNAME: ''
          probes:
            liveness:
              enabled: false
            readiness:
              enabled: false
            startup:
              enabled: false
