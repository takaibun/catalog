cnpg:
  main:
    database: vandam
    enabled: true
    user: vandam
image:
  pullPolicy: IfNotPresent
  repository: ghcr.io/floppy/van_dam
  tag: latest
persistence:
  libraries:
    enabled: true
    mountPath: /libraries
portal:
  open:
    enabled: true
redis:
  enabled: true
securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsGroup: 0
    runAsNonRoot: false
    runAsUser: 0
service:
  main:
    ports:
      main:
        port: 3214
        protocol: http
        targetPort: 3214
workload:
  main:
    podSpec:
      containers:
        main:
          env:
            DATABASE_URL:
              secretKeyRef:
                key: std
                name: cnpg-main-urls
            REDIS_URL:
              secretKeyRef:
                expandObjectName: false
                key: url
                name: '{{ printf "%s-%s" .Release.Name "rediscreds" }}'
            SECRET_KEY_BASE:
              secretKeyRef:
                key: SECRET_KEY_BASE
                name: vandam-secrets
