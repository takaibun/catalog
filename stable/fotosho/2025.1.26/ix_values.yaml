image:
  pullPolicy: IfNotPresent
  repository: advplyr/fotosho
  tag: latest
persistence:
  config:
    enabled: true
    mountPath: /config
  photos:
    enabled: true
    mountPath: /photos
  thumbs:
    enabled: true
    mountPath: /thumbnails
portal:
  open:
    enabled: true
securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsGroup: 0
    runAsUser: 0
service:
  main:
    ports:
      main:
        port: 13377
        protocol: tcp
        targetPort: 80
