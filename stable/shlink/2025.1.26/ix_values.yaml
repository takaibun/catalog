cnpg:
  main:
    database: shlink
    enabled: true
    user: shlink
image:
  pullPolicy: IfNotPresent
  repository: shlinkio/shlink
  tag: latest
portal:
  open:
    enabled: false
redis:
  enabled: true
  includeCommon: true
  redisUsername: default
securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsGroup: 0
    runAsNonRoot: false
    runAsUser: 0
service:
  main:
    ports:
      main:
        port: 10153
workload:
  main:
    podSpec:
      containers:
        main:
          env:
            ANONYMIZE_REMOTE_ADDR: true
            DB_DRIVER: postgres
            DB_HOST:
              secretKeyRef:
                key: host
                name: cnpg-main-urls
            DB_NAME: '{{ .Values.cnpg.main.database }}'
            DB_PASSWORD:
              secretKeyRef:
                key: password
                name: cnpg-main-user
            DB_USER: '{{ .Values.cnpg.main.user }}'
            DEFAULT_DOMAIN: ''
            ENABLE_PERIODIC_VISIT_LOCATE: true
            GEOLITE_LICENSE_KEY: ''
            IS_HTTPS_ENABLED: true
            PORT: '{{ .Values.service.main.ports.main.port }}'
            REDIS_SERVERS:
              secretKeyRef:
                expandObjectName: false
                key: url
                name: '{{ printf "%s-%s" .Release.Name "rediscreds" }}'
          probes:
            liveness:
              path: /rest/health
            readiness:
              path: /rest/health
            startup:
              path: /rest/health
