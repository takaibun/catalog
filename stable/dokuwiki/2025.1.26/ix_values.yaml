image:
  pullPolicy: IfNotPresent
  repository: bitnami/dokuwiki
  tag: latest
persistence:
  config:
    enabled: true
    mountPath: /bitnami/dokuwiki
portal:
  open:
    enabled: true
securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsGroup: 0
    runAsNonRoot: false
    runAsUser: 0
service:
  main:
    ports:
      main:
        port: 10123
        targetPort: 8080
workload:
  main:
    podSpec:
      containers:
        main:
          env:
            DOKUWIKI_EMAIL: admin@example.com
            DOKUWIKI_FULL_NAME: Super Admin
            DOKUWIKI_PASSWORD: supersecret
            DOKUWIKI_USERNAME: admin
            DOKUWIKI_WIKI_NAME: DokuWiki
          probes:
            liveness:
              path: /
              type: http
            readiness:
              path: /
              type: http
            startup:
              path: /
              type: http
