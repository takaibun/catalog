image:
  pullPolicy: IfNotPresent
  repository: ghcr.io/k8s-at-home/haste-server
  tag: latest
persistence:
  config:
    enabled: true
    mountPath: /config
portal:
  open:
    enabled: true
service:
  main:
    ports:
      main:
        port: 7777
        targetPort: 7777
workload:
  main:
    podSpec:
      containers:
        main:
          env:
            STORAGE_FILEPATH: /config
            STORAGE_TYPE: file
