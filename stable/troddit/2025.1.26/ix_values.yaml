image:
  pullPolicy: IfNotPresent
  repository: bsyed/troddit
  tag: latest
persistence: {}
portal:
  open:
    enabled: true
securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsGroup: 0
    runAsUser: 0
service:
  main:
    ports:
      main:
        port: 3000
        protocol: tcp
        targetPort: 3000
workload:
  main:
    podSpec:
      containers:
        main:
          env:
            CLIENT_ID: ''
            CLIENT_SECRET: ''
            NEXTAUTH_SECRET: ''
            NEXTAUTH_URL: ''
            REDDIT_REDIRECT: ''
