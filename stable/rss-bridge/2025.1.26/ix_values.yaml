image:
  pullPolicy: IfNotPresent
  repository: rssbridge/rss-bridge
  tag: latest
persistence:
  config:
    enabled: true
    mountPath: /config
  varrun:
    enabled: false
portal:
  open:
    enabled: true
securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsGroup: 0
    runAsNonRoot: false
    runAsUser: 0
service:
  main:
    ports:
      main:
        port: 10225
workload:
  main:
    podSpec:
      containers:
        main:
          env:
            HTTP_PORT: '{{ .Values.service.main.ports.main.port }}'
