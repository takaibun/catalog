image:
  pullPolicy: IfNotPresent
  repository: littlestache/synctube
  tag: latest
persistence:
  storageconfig:
    enabled: true
    mountPath: /usr/src/app/user
portal:
  open:
    enabled: true
securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsGroup: 0
    runAsNonRoot: false
    runAsUser: 0
service:
  main:
    ports:
      main:
        port: 4200
        protocol: http
        targetPort: 4200
