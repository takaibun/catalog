image:
  pullPolicy: IfNotPresent
  repository: rhasspy/wyoming-piper
  tag: latest
persistence:
  config:
    enabled: true
    mountPath: /data
portal:
  open:
    enabled: false
service:
  main:
    ports:
      main:
        port: 10200
        protocol: tcp
        targetPort: 10200
workload:
  main:
    podSpec:
      containers:
        main:
          probes:
            liveness:
              port: 10200
              type: tcp
            readiness:
              port: 10200
              type: tcp
            startup:
              port: 10200
              type: tcp
wyoming_piper:
  length_scale: '1.0'
  max_piper_procs: 1
  noise_scale: '0.667'
  noise_w: '0.333'
  speaker: 0
  voice: en_US-lessac-medium
