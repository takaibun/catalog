image:
  pullPolicy: IfNotPresent
  repository: towfiqi/serpbear
  tag: latest
persistence:
  data:
    enabled: true
    mountPath: /app/data
portal:
  open:
    enabled: true
serpbear:
  api_key: ''
  app_url: http://localhost:10605
  password: secret
  session_duration: 24
  user: admin
service:
  main:
    ports:
      main:
        port: 10605
        protocol: http
        targetPort: 3000
workload:
  main:
    podSpec:
      containers:
        main:
          envFrom:
          - secretRef:
              name: serpbear-secret
