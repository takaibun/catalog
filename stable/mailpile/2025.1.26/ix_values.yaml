image:
  pullPolicy: IfNotPresent
  repository: rroemhild/mailpile
  tag: latest
persistence:
  path1:
    enabled: true
    mountPath: /root/.local/share/Mailpile
  path2:
    enabled: true
    mountPath: /root/.gnupg
portal:
  open:
    enabled: true
securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsGroup: 0
    runAsUser: 0
service:
  main:
    ports:
      main:
        port: 33411
        protocol: tcp
        targetPort: 33411
