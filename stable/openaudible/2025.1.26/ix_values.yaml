image:
  pullPolicy: IfNotPresent
  repository: openaudible/openaudible
  tag: latest
persistence:
  config:
    enabled: true
    mountPath: /config/OpenAudible
portal:
  open:
    enabled: true
securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsGroup: 0
    runAsUser: 0
service:
  main:
    ports:
      main:
        port: 10325
        protocol: http
        targetPort: 3000
