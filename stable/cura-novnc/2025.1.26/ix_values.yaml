image:
  pullPolicy: IfNotPresent
  repository: mikeah/cura-novnc
  tag: latest
persistence:
  homefolder:
    enabled: true
    mountPath: /home/cura/
  prints:
    enabled: true
    mountPath: /prints/
portal:
  open:
    enabled: true
securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsGroup: 0
    runAsNonRoot: false
    runAsUser: 0
service:
  main:
    ports:
      main:
        port: 16081
        protocol: http
        targetPort: 8080
workload:
  main:
    podSpec:
      containers:
        main:
          env: {}
          probes:
            liveness:
              path: /
              type: http
            readiness:
              path: /
              type: http
            startup:
              path: /
              type: http
