image:
  pullPolicy: IfNotPresent
  repository: syncthing/syncthing
  tag: latest
persistence:
  config:
    enabled: true
    mountPath: /var/syncthing
portal:
  open:
    enabled: true
service:
  discovery:
    enabled: true
    ports:
      discovery:
        enabled: true
        port: 21027
        protocol: udp
        targetPort: 21027
  listeners:
    enabled: true
    ports:
      tcp:
        enabled: true
        port: 22000
        targetPort: 22000
  listeners-udp:
    enabled: true
    ports:
      udp:
        enabled: true
        port: 22000
        protocol: udp
        targetPort: 22000
  main:
    ports:
      main:
        port: 8384
        targetPort: 8384
workload:
  main:
    podSpec:
      containers:
        main:
          probes:
            liveness:
              path: /rest/noauth/health
            readiness:
              path: /rest/noauth/health
            startup:
              path: /rest/noauth/health
