image:
  pullPolicy: IfNotPresent
  repository: causticlab/hass-configurator-docker
  tag: latest
persistence:
  config:
    enabled: true
    mountPath: /config
  hass-config:
    enabled: true
    mountPath: /hass-config
portal:
  open:
    enabled: true
securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsGroup: 0
    runAsUser: 0
service:
  main:
    ports:
      main:
        port: 3218
        protocol: tcp
        targetPort: 3218
