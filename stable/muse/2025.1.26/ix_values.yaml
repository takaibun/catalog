image:
  pullPolicy: IfNotPresent
  repository: codetheweb/muse
  tag: latest
persistence:
  config:
    enabled: true
    mountPath: /config
portal:
  open:
    enabled: false
securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsGroup: 0
    runAsNonRoot: false
    runAsUser: 0
service:
  main:
    enabled: false
    ports:
      main:
        enabled: false
workload:
  main:
    podSpec:
      containers:
        main:
          env:
            DATA_DIR: /config
            DISCORD_TOKEN: ''
            SPOTIFY_CLIENT_ID: ''
            SPOTIFY_CLIENT_SECRET: ''
            YOUTUBE_API_KEY: ''
          probes:
            liveness:
              enabled: false
            readiness:
              enabled: false
            startup:
              enabled: false
