image:
  pullPolicy: IfNotPresent
  repository: jwater7/godaddy-publicip-updater
  tag: latest
persistence: {}
portal:
  open:
    enabled: false
securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsGroup: 0
    runAsUser: 0
service:
  main:
    enabled: false
    ports:
      main:
        enabled: false
workload:
  main:
    podSpec:
      containers:
        main:
          env:
            GODADDY_API_KEY: ''
            GODADDY_API_SECRET: ''
            GODADDY_DOMAINS: ''
          probes:
            liveness:
              enabled: false
            readiness:
              enabled: false
            startup:
              enabled: false
