configmap:
  health:
    data:
      ping_liveness_local.sh: "#!/bin/bash\n[[ -n \"$REDIS_PASSWORD\" ]] && export\
        \ REDISCLI_AUTH=\"$REDIS_PASSWORD\"\nresponse=$(\n  timeout -s 3 $1 \\\n \
        \ redis-cli \\\n    -h localhost \\\n    -p $REDIS_PORT \\\n    ping\n)\n\
        if [ \"$response\" != \"PONG\" ] && [ \"$response\" != \"LOADING Redis is\
        \ loading the dataset in memory\" ]; then\n  echo \"$response\"\n  exit 1\n\
        fi"
      ping_liveness_local_and_master.sh: 'script_dir="$(dirname "$0")"

        exit_status=0

        "$script_dir/ping_liveness_local.sh" $1 || exit_status=$?

        "$script_dir/ping_liveness_master.sh" $1 || exit_status=$?

        exit $exit_status'
      ping_liveness_master.sh: "#!/bin/bash\n[[ -n \"$REDIS_MASTER_PASSWORD\" ]] &&\
        \ export REDISCLI_AUTH=\"$REDIS_MASTER_PASSWORD\"\nresponse=$(\n  timeout\
        \ -s 3 $1 \\\n  redis-cli \\\n    -h $REDIS_MASTER_HOST \\\n    -p $REDIS_MASTER_PORT_NUMBER\
        \ \\\n    ping\n)\nif [ \"$response\" != \"PONG\" ] && [ \"$response\" !=\
        \ \"LOADING Redis is loading the dataset in memory\" ]; then\n  echo \"$response\"\
        \n  exit 1\nfi"
      ping_readiness_local.sh: "#!/bin/bash\n[[ -n \"$REDIS_PASSWORD\" ]] && export\
        \ REDISCLI_AUTH=\"$REDIS_PASSWORD\"\nresponse=$(\n  timeout -s 3 $1 \\\n \
        \ redis-cli \\\n    -h localhost \\\n    -p $REDIS_PORT \\\n    ping\n)\n\
        if [ \"$response\" != \"PONG\" ]; then\n  echo \"failed to connect using password:\
        \ $REDIS_PASSWORD response: $response\"\n  exit 1\nfi"
      ping_readiness_local_and_master.sh: 'script_dir="$(dirname "$0")"

        exit_status=0

        "$script_dir/ping_readiness_local.sh" $1 || exit_status=$?

        "$script_dir/ping_readiness_master.sh" $1 || exit_status=$?

        exit $exit_status'
      ping_readiness_master.sh: "#!/bin/bash\n[[ -n \"$REDIS_MASTER_PASSWORD\" ]]\
        \ && export REDISCLI_AUTH=\"$REDIS_MASTER_PASSWORD\"\nresponse=$(\n  timeout\
        \ -s 3 $1 \\\n  redis-cli \\\n    -h $REDIS_MASTER_HOST \\\n    -p $REDIS_MASTER_PORT_NUMBER\
        \ \\\n    ping\n)\nif [ \"$response\" != \"PONG\" ]; then\n  echo \"$response\"\
        \n  exit 1\nfi"
    enabled: true
image:
  pullPolicy: IfNotPresent
  repository: bitnami/redis
  tag: latest
includeCommon: true
password: PLACEHOLDERPASSWORD
persistence:
  redis-health:
    defaultMode: '0755'
    enabled: true
    items:
    - key: ping_readiness_local.sh
      path: ping_readiness_local.sh
    - key: ping_liveness_local.sh
      path: ping_liveness_local.sh
    - key: ping_readiness_master.sh
      path: ping_readiness_master.sh
    - key: ping_liveness_master.sh
      path: ping_liveness_master.sh
    - key: ping_liveness_local_and_master.sh
      path: ping_liveness_local_and_master.sh
    - key: ping_readiness_local_and_master.sh
      path: ping_readiness_local_and_master.sh
    mountPath: /health
    objectName: health
    type: configmap
portal:
  open:
    enabled: false
securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsGroup: 0
service:
  main:
    ports:
      main:
        port: 6379
        targetPort: 6379
volumeClaimTemplates:
  data:
    accessModes:
    - ReadWriteOnce
    enabled: true
    mountPath: /bitnami/redis
workload:
  main:
    podSpec:
      containers:
        main:
          env:
            ALLOW_EMPTY_PASSWORD: 'yes'
            REDIS_PASSWORD: '{{ .Values.password }}'
            REDIS_PORT: '{{ .Values.service.main.ports.main.targetPort }}'
            REDIS_REPLICATION_MODE: master
          probes:
            liveness:
              command:
              - sh
              - -c
              - /health/ping_liveness_local.sh 2
              enabled: true
              type: exec
            readiness:
              command:
              - sh
              - -c
              - /health/ping_readiness_local.sh 2
              enabled: true
              type: exec
            startup:
              command:
              - sh
              - -c
              - /health/ping_readiness_local.sh 2
              enabled: true
              type: exec
    replicas: 1
    strategy: RollingUpdate
    type: StatefulSet
