image:
  pullPolicy: IfNotPresent
  repository: ich777/steamcmd
  tag: latest
persistence:
  serverfiles:
    enabled: true
    mountPath: /serverdata/serverfiles
  steamcmd:
    enabled: true
    mountPath: /serverdata/steamcmd
portal:
  open:
    enabled: false
securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsGroup: 0
    runAsNonRoot: false
    runAsUser: 0
service:
  main:
    enabled: true
    ports:
      main:
        enabled: true
        port: 27015
        protocol: udp
  steam:
    enabled: true
    ports:
      steam:
        enabled: true
        port: 27016
        protocol: tcp
workload:
  main:
    podSpec:
      containers:
        main:
          env:
            GAME_ID: '1110390'
            GAME_PORT: '{{ .Values.service.main.ports.main.port }}'
            PASSWRD: ''
            ROCKET_FORCE_UPDATE: ''
            ROCKET_MOD: ''
            ROCKET_URL: https://ci.rocketmod.net/job/Rocket.Unturned/lastSuccessfulBuild/artifact/Rocket.Unturned/bin/Release/Rocket.zip
            USERNAME: ''
            VALIDATE: false
          probes:
            liveness:
              enabled: false
            readiness:
              enabled: false
            startup:
              enabled: false
