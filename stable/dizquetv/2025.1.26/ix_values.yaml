image:
  pullPolicy: IfNotPresent
  repository: vexorian/dizquetv
  tag: latest
nvidiaImage:
  pullPolicy: IfNotPresent
  repository: vexorian/dizquetv
  tag: 1.5.3-nvidia@sha256:883f5ebc532acfdd64aed8ee89d53ac81794edb49bbb2adfca5b274ff37ae389
persistence:
  config:
    enabled: true
    mountPath: /home/node/app/.dizquetv
portal:
  open:
    enabled: true
service:
  main:
    ports:
      main:
        port: 10071
        targetPort: 8000
workload:
  main:
    podSpec:
      containers:
        main:
          imageSelector: image
          probes:
            liveness:
              path: /
              type: http
            readiness:
              path: /
              type: http
            startup:
              path: /
              type: http
