image:
  pullPolicy: IfNotPresent
  repository: ghcr.io/static-web-server/static-web-server
  tag: latest
persistence:
  config:
    enabled: true
    mountPath: /public
portal:
  open:
    enabled: true
service:
  main:
    ports:
      main:
        port: 38080
        protocol: http
workload:
  main:
    podSpec:
      containers:
        main:
          env:
            SERVER_PORT: '{{ .Values.service.main.ports.main.port }}'
            SERVER_ROOT: /public
          probes:
            liveness:
              type: tcp
            readiness:
              type: tcp
            startup:
              type: tcp
