image:
  pullPolicy: IfNotPresent
  repository: ghcr.io/linuxserver/bookstack
  tag: latest
mariadb:
  enabled: true
  includeCommon: true
  mariadbDatabase: bookstack
  mariadbUsername: bookstack
persistence:
  config:
    enabled: true
    mountPath: /config
portal:
  open:
    enabled: true
securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsGroup: 0
    runAsNonRoot: false
    runAsUser: 0
service:
  main:
    ports:
      main:
        port: 10112
        protocol: http
        targetPort: 80
workload:
  main:
    podSpec:
      containers:
        main:
          env:
            APP_KEY:
              secretKeyRef:
                key: APP_KEY
                name: secrets
            APP_URL: ''
            DB_DATABASE: '{{ .Values.mariadb.mariadbDatabase }}'
            DB_HOST:
              secretKeyRef:
                expandObjectName: false
                key: plainhost
                name: '{{ printf "%s-%s" .Release.Name "mariadbcreds" }}'
            DB_PASS: '{{ .Values.mariadb.password }}'
            DB_USER: '{{ .Values.mariadb.mariadbUsername }}'
