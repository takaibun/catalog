avidemux:
  DISPLAY_HEIGHT: 768
  DISPLAY_WIDTH: 1280
  ENABLE_CJK_FONT: false
  KEEP_APP_RUNNING: false
  SECURE_CONNECTION: false
configmap:
  avidemux:
    data:
      DISPLAY_HEIGHT: '{{ .Values.avidemux.DISPLAY_HEIGHT }}'
      DISPLAY_WIDTH: '{{ .Values.avidemux.DISPLAY_WIDTH }}'
      ENABLE_CJK_FONT: '{{ ternary "1" "0" .Values.avidemux.ENABLE_CJK_FONT }}'
      KEEP_APP_RUNNING: '{{ ternary "1" "0" .Values.avidemux.KEEP_APP_RUNNING }}'
      SECURE_CONNECTION: '{{ ternary "1" "0" .Values.avidemux.SECURE_CONNECTION }}'
    enabled: true
image:
  pullPolicy: IfNotPresent
  repository: jlesage/avidemux
  tag: latest
persistence:
  config:
    enabled: true
    mountPath: /config
  storage:
    enabled: true
    mountPath: /storage
portal:
  open:
    enabled: true
securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsGroup: 0
    runAsNonRoot: false
    runAsUser: 0
service:
  main:
    ports:
      main:
        port: 10272
        protocol: http
        targetPort: 5800
  vnc:
    enabled: true
    ports:
      vnc:
        enabled: true
        port: 10273
        protocol: tcp
        targetPort: 5900
workload:
  main:
    podSpec:
      containers:
        main:
          env:
            VNC_PASSWORD: ''
          envFrom:
          - configMapRef:
              name: avidemux
          securityContext:
            capabilities:
              add:
              - NET_BIND_SERVICE
              - KILL
