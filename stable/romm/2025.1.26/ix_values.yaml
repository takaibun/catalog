image:
  pullPolicy: IfNotPresent
  repository: ghcr.io/rommapp/romm
  tag: latest
mariadb:
  enabled: true
  includeCommon: true
  mariadbDatabase: romm
  mariadbUsername: romm
persistence:
  assets:
    enabled: true
    mountPath: /romm/assets
  config:
    enabled: true
    mountPath: /romm/config
  library:
    enabled: true
    mountPath: /romm/library
  resources:
    enabled: true
    mountPath: /romm/resources
portal:
  open:
    enabled: true
redis:
  enabled: true
  includeCommon: true
romm:
  auth:
    pass: admin
    user: admin
securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsGroup: 0
    runAsNonRoot: false
    runAsUser: 0
service:
  main:
    ports:
      main:
        port: 10680
        protocol: http
        targetPort: 8080
workload:
  main:
    podSpec:
      containers:
        main:
          env:
            CLIENT_ID: ''
            CLIENT_SECRET: ''
            DB_HOST:
              secretKeyRef:
                expandObjectName: false
                key: plainhost
                name: '{{ printf "%s-%s" .Release.Name "mariadbcreds" }}'
            DB_NAME: '{{ .Values.mariadb.mariadbDatabase }}'
            DB_PASSWD: '{{ .Values.mariadb.password }}'
            DB_PORT: 3306
            DB_USER: '{{ .Values.mariadb.mariadbUsername }}'
            ENABLE_EXPERIMENTAL_REDIS: true
            REDIS_HOST:
              secretKeyRef:
                expandObjectName: false
                key: plainhost
                name: '{{ printf "%s-%s" .Release.Name "rediscreds" }}'
            REDIS_PASSWORD: '{{ .Values.redis.password }}'
            REDIS_PORT: 6379
            ROMM_AUTH_ENABLED: true
            ROMM_AUTH_PASSWORD: '{{ .Values.romm.auth.pass}}'
            ROMM_AUTH_SECRET_KEY:
              secretKeyRef:
                key: ROMM_AUTH_SECRET_KEY
                name: romm-secrets
            ROMM_AUTH_USERNAME: '{{ .Values.romm.auth.user}}'
            ROMM_BASE_PATH: /romm
            ROMM_DB_DRIVER: mariadb
            STEAMGRIDDB_API_KEY: ''
          probes:
            liveness:
              type: http
            readiness:
              type: http
            startup:
              type: http
