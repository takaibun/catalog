image:
  pullPolicy: IfNotPresent
  repository: sickgear/sickgear
  tag: latest
persistence:
  config:
    enabled: true
    mountPath: /config
  varrun:
    enabled: true
portal:
  open:
    enabled: true
securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsGroup: 0
    runAsNonRoot: false
    runAsUser: 0
service:
  main:
    ports:
      main:
        port: 10066
        targetPort: 8081
workload:
  main:
    podSpec:
      containers:
        main:
          env:
            APP_DATA: /config
