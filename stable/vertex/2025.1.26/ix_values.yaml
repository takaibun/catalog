image:
  pullPolicy: IfNotPresent
  repository: lswl/vertex
  tag: latest
persistence:
  config:
    enabled: true
    mountPath: /vertex
portal:
  open:
    enabled: true
securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsGroup: 0
    runAsUser: 0
service:
  main:
    ports:
      main:
        port: 3000
        protocol: tcp
        targetPort: 3000
workload:
  main:
    podSpec:
      containers:
        main:
          env:
            PORT: '3000'
