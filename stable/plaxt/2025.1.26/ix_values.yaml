image:
  pullPolicy: IfNotPresent
  repository: xanderstrike/goplaxt
  tag: latest
persistence:
  config:
    enabled: true
    mountPath: /app/keystore
portal:
  open:
    enabled: true
securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsGroup: 0
    runAsNonRoot: false
    runAsUser: 0
service:
  main:
    ports:
      main:
        port: 8000
        protocol: http
        targetPort: 8000
workload:
  main:
    podSpec:
      containers:
        main:
          env:
            TRAKT_ID: ''
            TRAKT_SECRET: ''
