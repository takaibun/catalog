image:
  pullPolicy: IfNotPresent
  repository: automaticrippingmachine/automatic-ripping-machine
  tag: latest
persistence:
  arm:
    enabled: true
    mountPath: /home/arm
  config:
    enabled: true
    mountPath: /etc/arm/config
portal:
  open:
    enabled: true
securityContext:
  container:
    allowPrivilegeEscalation: true
    readOnlyRootFilesystem: false
    runAsGroup: 0
    runAsNonRoot: false
    runAsUser: 0
service:
  main:
    ports:
      main:
        port: 10683
        protocol: http
        targetPort: 8080
workload:
  main:
    podSpec:
      containers:
        main:
          env:
            ARM_GID: '{{ .Values.securityContext.pod.fsGroup }}'
            ARM_UID: '{{ .Values.securityContext.container.PUID }}'
