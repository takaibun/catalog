image:
  pullPolicy: IfNotPresent
  repository: rmountjoy/dashmachine
  tag: latest
persistence:
  appdata:
    enabled: true
    mountPath: /dashmachine/dashmachine/user_data
portal:
  open:
    enabled: true
securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsGroup: 0
    runAsUser: 0
service:
  main:
    ports:
      main:
        port: 5000
        protocol: tcp
        targetPort: 5000
