cnpg:
  main:
    database: quassel-core
    enabled: true
    user: quassel-core
image:
  pullPolicy: IfNotPresent
  repository: ghcr.io/linuxserver/quassel-core
  tag: latest
persistence:
  varrun:
    enabled: true
portal:
  open:
    enabled: false
securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsGroup: 0
    runAsNonRoot: false
    runAsUser: 0
service:
  ident:
    enabled: true
    ports:
      ident:
        enabled: true
        port: 10113
        targetPort: 10113
  main:
    ports:
      main:
        port: 4242
        targetPort: 4242
workload:
  main:
    podSpec:
      containers:
        main:
          env:
            AUTH_AUTHENTICATOR: Database
            DB_BACKEND: PostgreSQL
            DB_PGSQL_DATABASE: '{{ .Values.cnpg.main.database }}'
            DB_PGSQL_HOSTNAME:
              secretKeyRef:
                key: host
                name: cnpg-main-urls
            DB_PGSQL_PASSWORD:
              secretKeyRef:
                key: password
                name: cnpg-main-user
            DB_PGSQL_PORT: 5432
            DB_PGSQL_USERNAME: '{{ .Values.cnpg.main.user }}'
            RUN_OPTS: --config-from-environment
          probes:
            liveness:
              type: tcp
            readiness:
              type: tcp
            startup:
              type: tcp
