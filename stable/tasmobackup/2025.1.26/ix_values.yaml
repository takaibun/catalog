env:
  DBNAME: data/tasmobackup
  DBTYPE: sqlite
image:
  pullPolicy: IfNotPresent
  repository: danmed/tasmobackupv1
  tag: latest
persistence:
  data:
    enabled: true
    mountPath: /var/www/html/data
portal:
  open:
    enabled: true
securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsGroup: 0
    runAsNonRoot: false
    runAsUser: 0
service:
  main:
    ports:
      main:
        port: 8259
        protocol: http
        targetPort: 80
workload:
  main:
    podSpec:
      containers:
        main:
          env:
            DBNAME: data/tasmobackup
            DBTYPE: sqlite
