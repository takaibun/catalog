image:
  pullPolicy: IfNotPresent
  repository: sissbruecker/linkding
  tag: latest
lifecycle:
  postStart:
    exec:
      command:
      - /bin/bash
      - -c
      - "if [ -f /etc/linkding/data/.superuser_exists ]; then\n  echo \"Superuser\
        \ has been created before. Skipping...\";\nelse\n  echo \"Creating superuser...\"\
        ;\n  export status=99;\n  until [ $status -eq 0 ];\n  do\n    python manage.py\
        \ createsuperuser --username=${DJANGO_SUPERUSER_USERNAME} --email=${DJANGO_SUPERUSER_EMAIL}\
        \ --noinput;\n    status=$?;\n    sleep 3;\n  done;\n  echo \"This file is\
        \ to ensure that init script won't try to create a superuser again and fail\
        \ because it already exsits\" > /etc/linkding/data/.superuser_exists;\n  echo\
        \ \"Superuser Created!\";\nfi;\n"
persistence:
  data:
    enabled: true
    mountPath: /etc/linkding/data
portal:
  open:
    enabled: true
securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsGroup: 0
    runAsNonRoot: false
    runAsUser: 0
service:
  main:
    ports:
      main:
        port: 10210
workload:
  main:
    podSpec:
      containers:
        main:
          env:
            LD_DISABLE_BACKGROUND_TASKS: false
            LD_DISABLE_URL_VALIDATION: false
            LD_REQUEST_TIMEOUT: 60
            LD_SERVER_PORT: '{{ .Values.service.main.ports.main.port }}'
            LD_SUPERUSER_NAME: superuser
            LD_SUPERUSER_PASSWORD: somesecret
