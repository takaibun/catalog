configmap:
  jdownloader:
    data:
      DISPLAY_HEIGHT: '{{ .Values.jdownloader.DISPLAY_HEIGHT }}'
      DISPLAY_WIDTH: '{{ .Values.jdownloader.DISPLAY_WIDTH }}'
      ENABLE_CJK_FONT: '{{ ternary "1" "0" .Values.jdownloader.ENABLE_CJK_FONT }}'
      KEEP_APP_RUNNING: '{{ ternary "1" "0" .Values.jdownloader.KEEP_APP_RUNNING }}'
      SECURE_CONNECTION: '{{ ternary "1" "0" .Values.jdownloader.SECURE_CONNECTION
        }}'
    enabled: true
image:
  pullPolicy: IfNotPresent
  repository: jlesage/jdownloader-2
  tag: latest
ingress:
  main:
    integrations:
      homepage:
        widget:
          type: jdownloader
jdownloader:
  DISPLAY_HEIGHT: 768
  DISPLAY_WIDTH: 1280
  ENABLE_CJK_FONT: false
  KEEP_APP_RUNNING: false
  SECURE_CONNECTION: false
persistence:
  config:
    enabled: true
    mountPath: /config
  output:
    enabled: true
    mountPath: /output
portal:
  open:
    enabled: true
securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsGroup: 0
    runAsNonRoot: false
    runAsUser: 0
service:
  main:
    ports:
      main:
        port: 10054
        targetPort: 5800
  myjd:
    enabled: true
    ports:
      myjd:
        enabled: true
        port: 3129
        targetPort: 3129
  vnc:
    enabled: true
    ports:
      vnc:
        enabled: true
        port: 10056
        targetPort: 5900
workload:
  main:
    podSpec:
      containers:
        main:
          env:
            VNC_PASSWORD: ''
          envFrom:
          - configMapRef:
              name: jdownloader
          probes:
            liveness:
              type: tcp
            readiness:
              type: tcp
            startup:
              type: tcp
          securityContext:
            capabilities:
              add:
              - NET_BIND_SERVICE
              - KILL
