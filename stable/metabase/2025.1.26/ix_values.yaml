cnpg:
  main:
    database: metabase
    enabled: true
    user: metabase
image:
  pullPolicy: IfNotPresent
  repository: metabase/metabase
  tag: latest
persistence:
  plugins:
    enabled: true
    mountPath: /plugins
portal:
  open:
    enabled: true
service:
  main:
    ports:
      main:
        port: 13030
        protocol: http
workload:
  main:
    podSpec:
      containers:
        main:
          env:
            JAVA_TIMEZONE: '{{ .Values.TZ }}'
            MB_DB_DBNAME: '{{ .Values.cnpg.main.database }}'
            MB_DB_HOST:
              secretKeyRef:
                key: host
                name: cnpg-main-urls
            MB_DB_PASS:
              secretKeyRef:
                key: password
                name: cnpg-main-user
            MB_DB_PORT: 5432
            MB_DB_TYPE: postgres
            MB_DB_USER: '{{ .Values.cnpg.main.user }}'
            MB_JETTY_PORT: '{{ .Values.service.main.ports.main.port }}'
