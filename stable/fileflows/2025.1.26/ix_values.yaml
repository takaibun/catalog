image:
  pullPolicy: IfNotPresent
  repository: revenz/fileflows
  tag: latest
persistence:
  data:
    enabled: true
    mountPath: /app/Data
  logs:
    enabled: true
    mountPath: /app/Logs
  media:
    enabled: true
    mountPath: /media
  temp:
    enabled: true
    mountPath: /temp
portal:
  open:
    enabled: true
securityContext:
  container:
    allowPrivilegeEscalation: true
    privileged: true
    readOnlyRootFilesystem: false
    runAsGroup: 0
    runAsNonRoot: false
    runAsUser: 0
service:
  main:
    ports:
      main:
        port: 10242
        targetPort: 5000
workload:
  main:
    podSpec:
      containers:
        main:
          env: {}
          probes:
            liveness:
              path: /
              type: http
            readiness:
              path: /
              type: http
            startup:
              path: /
              type: http
