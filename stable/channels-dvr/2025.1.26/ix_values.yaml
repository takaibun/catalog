image:
  pullPolicy: Always
  repository: fancybits/channels-dvr
  tag: latest
persistence:
  config:
    enabled: true
    mountPath: /channels-dvr
  recordings:
    enabled: true
    mountPath: /shares/DVR
portal:
  open:
    enabled: true
service:
  main:
    ports:
      main:
        port: 8089
        protocol: http
        targetPort: 8089
tveImage:
  pullPolicy: Always
  repository: fancybits/channels-dvr
  tag: tve@sha256:e59b99dcadcc75540a814d8199d0d7deba1f77f71cc2d225a3b5a3efe044781b
updated: true
workload:
  main:
    podSpec:
      containers:
        main:
          imageSelector: image
          probes:
            liveness:
              port: 8089
              type: http
            readiness:
              port: 8089
              type: http
            startup:
              port: 8089
              type: http
