image:
  pullPolicy: IfNotPresent
  repository: faldez/tanoshi
  tag: latest
persistence:
  directoryconfig:
    enabled: true
    mountPath: /tanoshi
portal:
  open:
    enabled: true
securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsGroup: 0
    runAsUser: 0
service:
  main:
    ports:
      main:
        port: 80
        protocol: tcp
        targetPort: 80
