image:
  pullPolicy: IfNotPresent
  repository: jonnyan404/verysync
  tag: latest
persistence:
  data:
    enabled: true
    mountPath: /data
  sync:
    enabled: true
    mountPath: /Sync
portal:
  open:
    enabled: true
securityContext:
  container:
    runAsGroup: 0
    runAsUser: 0
service:
  bt-udp1:
    enabled: true
    ports:
      bt-udp1:
        enabled: true
        port: 22037
        protocol: udp
        targetPort: 22037
  bt-udp2:
    enabled: true
    ports:
      bt-udp2:
        enabled: true
        port: 22027
        protocol: udp
        targetPort: 22027
  data:
    enabled: true
    ports:
      data:
        enabled: true
        port: 22330
        targetPort: 22330
  main:
    ports:
      main:
        port: 10193
workload:
  main:
    podSpec:
      containers:
        main:
          env:
            PORT: '{{ .Values.service.main.ports.main.port }}'
            VUID: '{{- $.Values.securityContext.container.PUID -}}'
