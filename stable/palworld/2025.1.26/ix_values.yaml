image:
  pullPolicy: IfNotPresent
  repository: ghcr.io/ich777/steamcmd
  tag: latest
palworld:
  backup:
    enabled: true
    interval: 120
    to_keep: 12
  game:
    active_unko: false
    admin_password: ''
    auto_reset_guild_time_no_online_players: '72.000000'
    ban_list_url: https://api.palworldgame.com/api/banlist.txt
    base_camp_max: 128
    base_camp_worker_max: 15
    build_object_damage_rate: '1.000000'
    build_object_deterioration_damage_rate: '1.000000'
    can_pickup_other_guild_death_penalty_drop: false
    collection_drop_rate: '1.000000'
    collection_object_hp_rate: '1.000000'
    collection_object_respawn_speed_rate: '1.000000'
    day_time_speed_rate: '1.000000'
    death_penalty: ALL
    description: A Palworld Server running in Kubernetes
    difficulty: None
    drop_item_alive_max_hours: '1.000000'
    drop_item_max: 3000
    drop_item_max_unko: 100
    enable_aim_assist_kb: false
    enable_aim_assist_pad: false
    enable_defense_other_guild_player: true
    enable_fast_travel: true
    enable_friendly_fire: false
    enable_invader_enemy: true
    enable_non_login_penalty: true
    enable_pvp_damage: false
    enemy_drop_item_rate: '1.000000'
    exist_players_after_logout: true
    exp_rate: '1.000000'
    guild_auto_reset_no_online_players: false
    is_multiplay: false
    is_pvp: false
    is_start_location_select_by_map: true
    max_players: 32
    max_players_coop: 4
    max_players_guild: 20
    name: TrueCharts Palworld Server
    night_time_speed_rate: '1.000000'
    pal_auto_hp_regene_rate: '1.000000'
    pal_auto_hp_regene_rate_in_sleep: '1.000000'
    pal_capture_rate: '1.000000'
    pal_damage_rate_attack: '1.000000'
    pal_damage_rate_defense: '1.000000'
    pal_egg_default_hatching_time: '72.000000'
    pal_spawn_num_rate: '1.000000'
    pal_stamina_decreace_rate: '1.000000'
    pal_stomach_decreace_rate: '1.000000'
    params:
    - -publiclobby
    params_extra:
    - -useperfthreads
    - -NoAsyncLoadingThread
    - -UseMultithreadForDS
    password: ''
    player_auto_hp_regene_rate: '1.000000'
    player_auto_hp_regene_rate_in_sleep: '1.000000'
    player_damage_rate_attack: '1.000000'
    player_damage_rate_defense: '1.000000'
    player_stamina_decreace_rate: '1.000000'
    player_stomach_decreace_rate: '1.000000'
    public_ip: ''
    region: ''
    update_public_ip: false
    use_auth: true
    work_speed_rate: '1.000000'
  rcon:
    enabled: true
    timeout: 10s
  steam:
    id: '2394010'
    password: ''
    username: ''
    validate: false
persistence:
  palworld-rcon:
    enabled: true
    objectName: palworld-rcon
    targetSelector:
      rcon:
        rcon:
          mountPath: /rcon.yaml
          readOnly: true
          subPath: rcon.yaml
    type: configmap
  serverfiles:
    enabled: true
    targetSelector:
      main:
        main:
          mountPath: /serverdata/serverfiles
        update-config-ini:
          mountPath: /serverdata/serverfiles
  steamcmd:
    enabled: true
    mountPath: /serverdata/steamcmd
portal:
  open:
    enabled: false
rconImage:
  pullPolicy: IfNotPresent
  repository: outdead/rcon
  tag: latest@sha256:f4ab6d4f86525e2d71534b839cc4e2241ffc9278759f7a70ef3aa434c5aec927
securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsGroup: 0
    runAsUser: 0
service:
  main:
    ports:
      main:
        port: 8211
        protocol: udp
  rcon:
    enabled: true
    ports:
      rcon:
        enabled: true
        port: 25575
        protocol: tcp
workload:
  main:
    podSpec:
      containers:
        main:
          env:
            BACKUP: '{{ .Values.palworld.backup.enabled }}'
            BACKUP_INTERVAL: '{{ .Values.palworld.backup.interval }}'
            BACKUP_TO_KEEP: '{{ .Values.palworld.backup.to_keep }}'
            GAME_ID: '{{ .Values.palworld.steam.id }}'
            GAME_PARAMS: '{{ printf "-port=%v -publicport=%v -rconport=%v %s" .Values.service.main.ports.main.port
              .Values.service.main.ports.main.port .Values.service.rcon.ports.rcon.port
              (join " " .Values.palworld.game.params) }}'
            GAME_PARAMS_EXTRA: '{{ join " " .Values.palworld.game.params_extra }}'
            PASSWRD: '{{ .Values.palworld.steam.password }}'
            SERVER_DIR: '{{ .Values.persistence.serverfiles.targetSelector.main.main.mountPath
              }}'
            SRV_ADMIN_PWD: '{{ .Values.palworld.game.admin_password }}'
            STEAMCMD_DIR: '{{ .Values.persistence.steamcmd.mountPath }}'
            UPDATE_PUBLIC_IP: '{{ .Values.palworld.game.update_public_ip }}'
            USERNAME: '{{ .Values.palworld.steam.username }}'
            VALIDATE: '{{ .Values.palworld.steam.validate }}'
          probes:
            liveness:
              port: '{{ .Values.service.rcon.ports.rcon.port }}'
              type: tcp
            readiness:
              port: '{{ .Values.service.rcon.ports.rcon.port }}'
              type: tcp
            startup:
              port: '{{ .Values.service.rcon.ports.rcon.port }}'
              type: tcp
      initContainers:
        update-config-ini:
          args:
          - "config={{ .Values.persistence.serverfiles.targetSelector.main.main.mountPath\
            \ }}/Pal/Saved/Config/LinuxServer\ncfgFile=${config}/PalWorldSettings.ini\n\
            dfCfgFile={{ .Values.persistence.serverfiles.targetSelector.main.main.mountPath\
            \ }}/DefaultPalWorldSettings.ini\nupdate_public_ip=\"{{ .Values.palworld.game.update_public_ip\
            \ }}\"\n\nmkdir -p ${config}\nif [ ! -f \"${cfgFile}\" ]; then\n    if\
            \ [ -f \"${dfCfgFile}\" ]; then\n        echo \"Default config file found,\
            \ copying as cfgFile...\"\n        cp \"${dfCfgFile}\" \"${cfgFile}\"\n\
            \    else\n        echo \"Config file not found, fetching...\"\n     \
            \   # Fetch the config file if it doesn't exist, just like the container\
            \ does\n        wget -qO \"${cfgFile}\" https://github.com/ich777/docker-steamcmd-server/raw/palworld/config/PalWorldSettings.ini\n\
            \    fi\nfi\n\nset_ini() {\n  local key=\"${1}\"\n  local value=\"${2}\"\
            \n  local flags=\"\"  # Initialize an empty string for flags\n\n  # Loop\
            \ through arguments starting from the third one\n  for arg in \"$@\";\
            \ do\n      if [ \"$arg\" != \"$key\" ] && [ \"$arg\" != \"$value\" ];\
            \ then\n          flags=\"$flags $arg\"  # Append each flag to the flags\
            \ string\n      fi\n  done\n\n  # Check if the key exists in the OptionSettings\
            \ section\n  if ! grep -q 'OptionSettings=(' \"$cfgFile\"; then\n    \
            \  echo \"OptionSettings section not found in '${cfgFile}'. Skipping...\"\
            \n      return\n  fi\n\n  # Check if the key exists within the OptionSettings\
            \ section\n  if ! grep -q \"${key}=\" \"$cfgFile\"; then\n      echo \"\
            Key '${key}' does not exist in the OptionSettings section of '${cfgFile}'.\
            \ Skipping...\"\n      return\n  fi\n\n  # Iterate over flags\n  for flag\
            \ in $flags; do\n      case $flag in\n          -q)\n              # Add\
            \ quotes around the value\n              value=\"\\\"$value\\\"\"\n  \
            \            ;;\n          -b)\n              # Handle boolean flag\n\
            \              if [ \"$(echo \"$value\" | tr '[:upper:]' '[:lower:]')\"\
            \ = \"true\" ]; then\n                  value=\"True\"\n             \
            \ else\n                  value=\"False\"\n              fi\n        \
            \      ;;\n          *)\n              echo \"Unknown flag: $flag. Skipping...\"\
            \n              ;;\n      esac\n  done\n\n  # Update the value within\
            \ the OptionSettings section\n  sed -i \"/OptionSettings=(/ {\n      :loop\n\
            \      /)$/! {\n          N\n          b loop\n      }\n      s|\\(${key}=\\\
            )[^,]*|\\1${value}|\n  }\" \"${cfgFile}\"\n\n  # Check if the closing\
            \ parenthesis is missing, and if so, add it\n  if ! grep -q ')$' \"${cfgFile}\"\
            ; then\n      sed -i \"\\|OptionSettings=(| s|$|)|\" \"${cfgFile}\"\n\
            \  fi\n\n  echo \"Set ${key} to ${value}\"\n}\n\necho \"the following\
            \ options are updating....\"\n\nset_ini \"RCONEnabled\" \"True\" -b\n\n\
            set_ini \"RCONPort\" \"{{ .Values.service.rcon.ports.rcon.port }}\"\n\
            set_ini \"PublicPort\" \"{{ .Values.service.main.ports.main.port }}\"\n\
            \nset_ini \"ServerPassword\" '{{ .Values.palworld.game.password }}' -q\n\
            set_ini \"AdminPassword\" '{{ .Values.palworld.game.admin_password }}'\
            \ -q\n\nset_ini \"ServerName\" '{{ .Values.palworld.game.name }}' -q\n\
            set_ini \"ServerDescription\" '{{ .Values.palworld.game.description }}'\
            \ -q\nset_ini \"Difficulty\" \"{{ .Values.palworld.game.difficulty }}\"\
            \ -q\nset_ini \"DeathPenalty\" \"{{ .Values.palworld.game.death_penalty\
            \ }}\" -q\nset_ini \"Region\" \"{{ .Values.palworld.game.region }}\" -q\n\
            \nset_ini \"AutoResetGuildTimeNoOnlinePlayers\" \"{{ .Values.palworld.game.auto_reset_guild_time_no_online_players\
            \ }}\"\nset_ini \"BaseCampMaxNum\" \"{{ .Values.palworld.game.base_camp_max\
            \ }}\"\nset_ini \"BaseCampWorkerMaxNum\" \"{{ .Values.palworld.game.base_camp_worker_max\
            \ }}\"\nset_ini \"BanListURL\" \"{{ .Values.palworld.game.ban_list_url\
            \ }}\" -q\nset_ini \"BuildObjectDamageRate\" \"{{ .Values.palworld.game.build_object_damage_rate\
            \ }}\"\nset_ini \"BuildObjectDeteriorationDamageRate\" \"{{ .Values.palworld.game.build_object_deterioration_damage_rate\
            \ }}\"\n\nset_ini \"bCanPickupOtherGuildDeathPenaltyDrop\" \"{{ .Values.palworld.game.can_pickup_other_guild_death_penalty_drop\
            \ }}\" -b\nset_ini \"bUseAuth\" \"{{ .Values.palworld.game.use_auth }}\"\
            \ -b\nset_ini \"bEnablePlayerToPlayerDamage\" \"{{ .Values.palworld.game.enable_pvp_damage\
            \ }}\" -b\nset_ini \"bEnableFriendlyFire\" \"{{ .Values.palworld.game.enable_friendly_fire\
            \ }}\" -b\nset_ini \"bEnableInvaderEnemy\" \"{{ .Values.palworld.game.enable_invader_enemy\
            \ }}\" -b\nset_ini \"bEnableAimAssistPad\" \"{{ .Values.palworld.game.enable_aim_assist_pad\
            \ }}\" -b\nset_ini \"bEnableAimAssistKeyboard\" \"{{ .Values.palworld.game.enable_aim_assist_kb\
            \ }}\" -b\nset_ini \"bEnableNonLoginPenalty\" \"{{ .Values.palworld.game.enable_non_login_penalty\
            \ }}\" -b\nset_ini \"bEnableFastTravel\" \"{{ .Values.palworld.game.enable_fast_travel\
            \ }}\" -b\nset_ini \"bEnableDefenseOtherGuildPlayer\" \"{{ .Values.palworld.game.enable_defense_other_guild_player\
            \ }}\" -b\nset_ini \"bIsMultiplay\" \"{{ .Values.palworld.game.is_multiplay\
            \ }}\" -b\nset_ini \"bIsStartLocationSelectByMap\" \"{{ .Values.palworld.game.is_start_location_select_by_map\
            \ }}\" -b\nset_ini \"bIsPvP\" \"{{ .Values.palworld.game.is_pvp }}\" -b\n\
            set_ini \"bExistPlayerAfterLogout\" \"{{ .Values.palworld.game.exist_players_after_logout\
            \ }}\" -b\nset_ini \"bActiveUNKO\" \"{{ .Values.palworld.game.active_unko\
            \ }}\" -b\nset_ini \"bAutoResetGuildNoOnlinePlayers\" \"{{ .Values.palworld.game.guild_auto_reset_no_online_players\
            \ }}\" -b\n\nset_ini \"CollectionDropRate\" \"{{ .Values.palworld.game.collection_drop_rate\
            \ }}\"\nset_ini \"CollectionObjectHpRate\" \"{{ .Values.palworld.game.collection_object_hp_rate\
            \ }}\"\nset_ini \"CollectionObjectRespawnSpeedRate\" \"{{ .Values.palworld.game.collection_object_respawn_speed_rate\
            \ }}\"\nset_ini \"CoopPlayerMaxNum\" \"{{ .Values.palworld.game.max_players_coop\
            \ }}\"\nset_ini \"DayTimeSpeedRate\" \"{{ .Values.palworld.game.day_time_speed_rate\
            \ }}\"\nset_ini \"DropItemMaxNum\" \"{{ .Values.palworld.game.drop_item_max\
            \ }}\"\nset_ini \"DropItemMaxNum_UNKO\" \"{{ .Values.palworld.game.drop_item_max_unko\
            \ }}\"\nset_ini \"DropItemAliveMaxHours\" \"{{ .Values.palworld.game.drop_item_alive_max_hours\
            \ }}\"\nset_ini \"EnemyDropItemRate\" \"{{ .Values.palworld.game.enemy_drop_item_rate\
            \ }}\"\nset_ini \"GuildPlayerMaxNum\" \"{{ .Values.palworld.game.max_players_guild\
            \ }}\"\nset_ini \"NightTimeSpeedRate\" \"{{ .Values.palworld.game.night_time_speed_rate\
            \ }}\"\nset_ini \"PalCaptureRate\" \"{{ .Values.palworld.game.pal_capture_rate\
            \ }}\"\nset_ini \"PalEggDefaultHatchingTime\" \"{{ .Values.palworld.game.pal_egg_default_hatching_time\
            \ }}\"\nset_ini \"PalSpawnNumRate\" \"{{ .Values.palworld.game.pal_spawn_num_rate\
            \ }}\"\nset_ini \"PalDamageRateAttack\" \"{{ .Values.palworld.game.pal_damage_rate_attack\
            \ }}\"\nset_ini \"PalDamageRateDefense\" \"{{ .Values.palworld.game.pal_damage_rate_defense\
            \ }}\"\nset_ini \"PlayerDamageRateAttack\" \"{{ .Values.palworld.game.player_damage_rate_attack\
            \ }}\"\nset_ini \"PlayerDamageRateDefense\" \"{{ .Values.palworld.game.player_damage_rate_defense\
            \ }}\"\nset_ini \"PlayerStomachDecreaceRate\" \"{{ .Values.palworld.game.player_stomach_decreace_rate\
            \ }}\"\nset_ini \"PlayerStaminaDecreaceRate\" \"{{ .Values.palworld.game.player_stamina_decreace_rate\
            \ }}\"\nset_ini \"PlayerAutoHPRegeneRate\" \"{{ .Values.palworld.game.player_auto_hp_regene_rate\
            \ }}\"\nset_ini \"PlayerAutoHpRegeneRateInSleep\" \"{{ .Values.palworld.game.player_auto_hp_regene_rate_in_sleep\
            \ }}\"\nset_ini \"PalStomachDecreaceRate\" \"{{ .Values.palworld.game.pal_stomach_decreace_rate\
            \ }}\"\nset_ini \"PalStaminaDecreaceRate\" \"{{ .Values.palworld.game.pal_stamina_decreace_rate\
            \ }}\"\nset_ini \"PalAutoHPRegeneRate\" \"{{ .Values.palworld.game.pal_auto_hp_regene_rate\
            \ }}\"\nset_ini \"PalAutoHpRegeneRateInSleep\" \"{{ .Values.palworld.game.pal_auto_hp_regene_rate_in_sleep\
            \ }}\"\nset_ini \"ServerPlayerMaxNum\" \"{{ .Values.palworld.game.max_players\
            \ }}\"\nset_ini \"WorkSpeedRate\" \"{{ .Values.palworld.game.work_speed_rate\
            \ }}\"\nset_ini \"ExpRate\" \"{{ .Values.palworld.game.exp_rate }}\"\n\
            \n# Check if update_public_ip is not true\nif [ \"${update_public_ip}\"\
            \ != \"true\" ]; then\n    set_ini \"PublicIP\" \"{{ .Values.palworld.game.public_ip\
            \ }}\" -q\nfi\n\necho \"Done!\"\n"
          command:
          - /bin/sh
          - -c
          enabled: true
          imageSelector: image
          type: init
  rcon:
    enabled: true
    podSpec:
      containers:
        rcon:
          enabled: true
          imageSelector: rconImage
          primary: true
          probes:
            liveness:
              enabled: false
            readiness:
              enabled: false
            startup:
              enabled: false
          stdin: true
          tty: true
    replicas: 1
    strategy: RollingUpdate
    type: Deployment
