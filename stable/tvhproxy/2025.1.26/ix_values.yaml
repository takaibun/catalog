image:
  pullPolicy: IfNotPresent
  repository: chvb/docker-tvhproxy
  tag: latest
persistence: {}
portal:
  open:
    enabled: false
securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsGroup: 0
    runAsUser: 0
service:
  main:
    enabled: false
    ports:
      main:
        enabled: false
workload:
  main:
    podSpec:
      containers:
        main:
          env:
            TVH_TUNER_COUNT: '4'
            TVH_URL: http://username:password@tvheadendip:9981
          probes:
            liveness:
              enabled: false
            readiness:
              enabled: false
            startup:
              enabled: false
