image:
  pullPolicy: IfNotPresent
  repository: wolveix/satisfactory-server
  tag: latest
persistence:
  config:
    enabled: true
    mountPath: /config
  tmp-dumps:
    enabled: true
    mountPath: /tmp/dumps
    type: emptyDir
portal:
  open:
    enabled: false
securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsGroup: 0
    runAsNonRoot: false
    runAsUser: 0
service:
  beacon:
    enabled: true
    ports:
      beacon:
        enabled: true
        port: 15000
        protocol: udp
        targetPort: 15000
  main:
    ports:
      main:
        port: 7777
        protocol: udp
        targetPort: 7777
  query:
    enabled: true
    ports:
      query:
        enabled: true
        port: 15777
        protocol: udp
        targetPort: 15777
workload:
  main:
    podSpec:
      containers:
        main:
          env:
            AUTOPAUSE: true
            AUTOSAVEINTERVAL: 300
            AUTOSAVENUM: 3
            AUTOSAVEONDISCONNECT: true
            CRASHREPORT: true
            DEBUG: false
            DISABLESEASONALEVENTS: false
            MAXPLAYERS: 4
            SERVERBEACONPORT: '{{ .Values.service.beacon.ports.beacon.targetPort }}'
            SERVERGAMEPORT: '{{ .Values.service.main.ports.main.targetPort }}'
            SERVERIP: 0.0.0.0
            SERVERQUERYPORT: '{{ .Values.service.query.ports.query.targetPort }}'
            SKIPUPDATE: false
            STEAMBETA: false
          probes:
            liveness:
              enabled: false
            readiness:
              enabled: false
            startup:
              enabled: false
