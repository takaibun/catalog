image:
  pullPolicy: IfNotPresent
  repository: awesometic/docusaurus
  tag: latest
persistence:
  config:
    enabled: true
    mountPath: /docusaurus
portal:
  open:
    enabled: true
securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsGroup: 0
    runAsNonRoot: false
    runAsUser: 0
service:
  main:
    ports:
      main:
        port: 13080
        protocol: http
        targetPort: 80
workload:
  main:
    podSpec:
      containers:
        main:
          env:
            AUTO_UPDATE: true
            TARGET_GID: '{{ .Values.securityContext.pod.fsGroup }}'
            TARGET_UID: '{{ .Values.securityContext.container.PUID }}'
            TEMPLATE: classic
            WEBSITE_NAME: Docusaurus HomeLab Website
