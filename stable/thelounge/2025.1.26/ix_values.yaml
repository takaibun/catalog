image:
  pullPolicy: IfNotPresent
  repository: thelounge/thelounge
  tag: latest
persistence:
  config:
    enabled: true
    mountPath: /config
portal:
  open:
    enabled: true
securityContext:
  container:
    runAsGroup: 0
    runAsNonRoot: false
    runAsUser: 0
service:
  main:
    ports:
      main:
        port: 10061
        targetPort: 9000
workload:
  main:
    podSpec:
      containers:
        main:
          env:
            THELOUNGE_HOME: /config
