image:
  pullPolicy: IfNotPresent
  repository: eafxx/traktarr
  tag: latest
persistence:
  config:
    enabled: true
    mountPath: /config
portal:
  open:
    enabled: false
securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsGroup: 0
    runAsUser: 0
service:
  main:
    enabled: false
    ports:
      main:
        enabled: false
traktarr:
  app_branch: master
  blacklist: true
  delay: '2.5'
  nosearch: true
  notifications: true
  runnow: false
  skipupdate: true
  sort: rating
workload:
  main:
    podSpec:
      containers:
        main:
          env:
            APP_BRANCH: '{{ .Values.traktarr.app_branch }}'
            BLACKLIST: '{{ ternary "yes" "no" .Values.traktarr.blacklist }}'
            DELAY: '{{ .Values.traktarr.delay }}'
            NOSEARCH: '{{ ternary "yes" "no" .Values.traktarr.nosearch }}'
            NOTIFICATIONS: '{{ ternary "yes" "no" .Values.traktarr.notifications }}'
            RUNNOW: '{{ ternary "yes" "no" .Values.traktarr.runnow }}'
            SKIPUPDATE: '{{ ternary "yes" "no" .Values.traktarr.skipupdate }}'
            SORT: '{{ .Values.traktarr.sort }}'
          probes:
            liveness:
              enabled: false
            readiness:
              enabled: false
            startup:
              enabled: false
