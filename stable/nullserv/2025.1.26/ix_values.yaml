image:
  pullPolicy: IfNotPresent
  repository: ghcr.io/k8s-at-home/nullserv
  tag: latest
persistence:
  config:
    enabled: true
    mountPath: /config
portal:
  open:
    enabled: true
securityContext:
  container:
    runAsGroup: 0
    runAsNonRoot: false
    runAsUser: 0
service:
  https:
    enabled: true
    ports:
      https:
        enabled: true
        port: 10005
        targetPort: 443
  main:
    ports:
      main:
        port: 10004
        targetPort: 80
workload:
  main:
    podSpec:
      containers:
        main:
          probes:
            readiness:
              custom: true
              enabled: true
              spec:
                httpGet:
                  path: /welcome.txt
                  port: main
    replicas: 2
