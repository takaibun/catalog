image:
  pullPolicy: IfNotPresent
  repository: ghcr.io/k8s-at-home/wireguard
  tag: latest
portal:
  open:
    enabled: false
securityContext:
  container:
    capabilities:
      add:
      - NET_ADMIN
      - SYS_MODULE
    readOnlyRootFilesystem: false
    runAsGroup: 0
    runAsNonRoot: false
    runAsUser: 0
service:
  main:
    ports:
      main:
        port: 51821
        protocol: udp
        targetPort: 51820
wg:
  config:
    data: '[Interface]

      Address = 10.0.0.1/24

      ListenPort = 51820

      PrivateKey = PRIVATE_KEY


      [Peer]

      PublicKey = PUBLIC_KEY

      AllowedIPs = 0.0.0.0/0

      Endpoint = wg.example:51820

      '
    enabled: false
  configFileHostPath: ''
  excludedIP4networks: []
  excludedIP6networks: []
  killswitch: false
workload:
  main:
    podSpec:
      containers:
        main:
          envFrom:
          - configMapRef:
              name: wg-env-config
          probes:
            liveness:
              enabled: false
            readiness:
              enabled: false
            startup:
              enabled: false
