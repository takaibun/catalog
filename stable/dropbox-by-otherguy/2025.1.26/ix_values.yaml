image:
  pullPolicy: IfNotPresent
  repository: otherguy/dropbox
  tag: latest
persistence:
  dropboxsettings:
    enabled: true
    mountPath: /opt/dropbox/.dropbox
  dropboxuserfiles:
    enabled: true
    mountPath: /opt/dropbox/Dropbox
portal:
  open:
    enabled: false
securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsGroup: 0
    runAsUser: 0
service:
  main:
    enabled: false
    ports:
      main:
        enabled: false
workload:
  main:
    podSpec:
      containers:
        main:
          env:
            DROPBOX_GID: '100'
            DROPBOX_UID: '99'
          probes:
            liveness:
              enabled: false
            readiness:
              enabled: false
            startup:
              enabled: false
