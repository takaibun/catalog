image:
  pullPolicy: IfNotPresent
  repository: ghcr.io/linuxserver/nano-wallet
  tag: latest
persistence:
  varrun:
    enabled: true
portal:
  open:
    enabled: true
securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsGroup: 0
    runAsNonRoot: false
    runAsUser: 0
service:
  main:
    ports:
      main:
        port: 10126
        targetPort: 80
