image:
  pullPolicy: IfNotPresent
  repository: ghcr.io/m1k1o/neko/firefox
  tag: latest
neko:
  auth:
    admin_pass: ''
    user_pass: ''
  control_protection: false
  cors:
  - '*'
  implicit_control: false
  ip: 0.0.0.0
  locks: []
  proxy: false
  screen: 1920x1080@30
persistence:
  downloads:
    enabled: true
    mountPath: /home/neko/Downloads
portal:
  open:
    enabled: true
remminaImage:
  pullPolicy: IfNotPresent
  repository: ghcr.io/m1k1o/neko/remmina
  tag: 2.8.11@sha256:78f15945b2141bd151e55c4865965e5ea360bf819774d6057762f56dbd04a770
securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsGroup: 0
    runAsUser: 0
service:
  main:
    ports:
      main:
        port: 10294
        protocol: http
  mux:
    enabled: true
    ports:
      tcp:
        enabled: true
        port: 52100
        protocol: tcp
      udp:
        enabled: true
        port: '{{ .Values.service.mux.ports.tcp.port }}'
        protocol: udp
torImage:
  pullPolicy: IfNotPresent
  repository: ghcr.io/m1k1o/neko/tor-browser
