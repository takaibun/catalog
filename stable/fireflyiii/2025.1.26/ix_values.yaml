cnpg:
  main:
    database: firefly
    enabled: true
    user: firefly
cronjob:
  annotations: {}
  failedJobsHistoryLimit: 5
  schedule: 0 3 * * *
  successfulJobsHistoryLimit: 2
image:
  pullPolicy: IfNotPresent
  repository: fireflyiii/core
  tag: latest
persistence:
  data:
    enabled: true
    mountPath: /var/www/html/storage/upload
portal:
  open:
    enabled: true
redis:
  enabled: true
  includeCommon: true
securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsGroup: 0
    runAsNonRoot: false
    runAsUser: 0
service:
  main:
    ports:
      main:
        port: 10082
        targetPort: 8080
workload:
  main:
    podSpec:
      containers:
        main:
          env:
            APP_KEY:
              secretKeyRef:
                key: APP_KEY
                name: firefly-secrets
            APP_URL: ''
            CACHE_DRIVER: redis
            DB_CONNECTION: pgsql
            DB_DATABASE: '{{ .Values.cnpg.main.database }}'
            DB_HOST:
              secretKeyRef:
                key: host
                name: cnpg-main-urls
            DB_PASSWORD:
              secretKeyRef:
                key: password
                name: cnpg-main-user
            DB_PORT: 5432
            DB_USERNAME: '{{ .Values.cnpg.main.user }}'
            REDIS_CACHE_DB: '1'
            REDIS_DB: '0'
            REDIS_HOST:
              secretKeyRef:
                expandObjectName: false
                key: plainhost
                name: '{{ printf "%s-%s" .Release.Name "rediscreds" }}'
            REDIS_PASSWORD: '{{ .Values.redis.password }}'
            REDIS_PORT: 6379
            REDIS_SCHEME: tcp
            SESSION_DRIVER: redis
            STATIC_CRON_TOKEN:
              secretKeyRef:
                key: STATIC_CRON_TOKEN
                name: firefly-secrets
            TRUSTED_PROXIES: 172.16.0.0/16
          probes:
            liveness:
              path: /login
            readiness:
              path: /login
            startup:
              path: /login
