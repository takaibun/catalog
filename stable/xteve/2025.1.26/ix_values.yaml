image:
  pullPolicy: IfNotPresent
  repository: ghcr.io/k8s-at-home/xteve
  tag: latest
persistence:
  config:
    enabled: true
    mountPath: /config
portal:
  open:
    enabled: true
securityContext:
  container:
    readOnlyRootFilesystem: false
service:
  main:
    ports:
      main:
        port: 34400
        targetPort: 34400
