image:
  pullPolicy: IfNotPresent
  repository: tessypowder/docker-kdenlive
  tag: latest
persistence:
  content:
    enabled: true
    mountPath: /sharedContent
portal:
  open:
    enabled: true
securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsGroup: 0
    runAsUser: 0
service:
  main:
    ports:
      main:
        port: 5800
        protocol: http
        targetPort: 5800
  vncport:
    enabled: true
    ports:
      vncport:
        enabled: true
        port: 5900
        protocol: tcp
        targetPort: 5900
