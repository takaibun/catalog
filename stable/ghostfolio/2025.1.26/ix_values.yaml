cnpg:
  main:
    database: ghostfolio
    enabled: true
    user: ghostfolio
image:
  pullPolicy: IfNotPresent
  repository: ghostfolio/ghostfolio
  tag: latest
portal:
  open:
    enabled: true
redis:
  enabled: true
  includeCommon: true
securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsGroup: 0
    runAsNonRoot: false
    runAsUser: 0
service:
  main:
    ports:
      main:
        port: 3333
        targetPort: 3333
workload:
  main:
    podSpec:
      containers:
        main:
          env:
            ACCESS_TOKEN_SALT:
              secretKeyRef:
                key: ACCESS_TOKEN_SALT
                name: ghostfolio-secrets
            ALPHA_VANTAGE_API_KEY: ''
            DATABASE_URL:
              secretKeyRef:
                key: DATABASE_URL
                name: ghostfolio-secrets
            JWT_SECRET_KEY:
              secretKeyRef:
                key: JWT_SECRET_KEY
                name: ghostfolio-secrets
            REDIS_HOST:
              secretKeyRef:
                expandObjectName: false
                key: plainhost
                name: '{{ printf "%s-%s" .Release.Name "rediscreds" }}'
            REDIS_PASSWORD: '{{ .Values.redis.password }}'
            REDIS_PORT: '6379'
          probes:
            liveness:
              path: /
              type: http
            readiness:
              path: /
              type: http
            startup:
              type: tcp
