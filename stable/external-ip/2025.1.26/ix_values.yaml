image:
  pullPolicy: IfNotPresent
  repository: xavierh/external-ip
  tag: latest
persistence: {}
portal:
  open:
    enabled: false
securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsGroup: 0
    runAsUser: 0
service:
  main:
    enabled: false
    ports:
      main:
        enabled: false
workload:
  main:
    podSpec:
      containers:
        main:
          env:
            DELAY: 5m
            NOTIFICATION_TYPE: ''
            PROVIDER: ''
            PUSHOVER_TITLE: ''
            PUSHOVER_TOKEN: ''
            PUSHOVER_USER: ''
            RECOVERY_ALERT: ''
          probes:
            liveness:
              enabled: false
            readiness:
              enabled: false
            startup:
              enabled: false
