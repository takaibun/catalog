image:
  pullPolicy: IfNotPresent
  repository: ghcr.io/k8s-at-home/leaf2mqtt
  tag: latest
portal:
  open:
    enabled: false
securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsGroup: 0
    runAsNonRoot: false
    runAsUser: 0
service:
  main:
    enabled: false
    ports:
      main:
        enabled: false
workload:
  main:
    podSpec:
      containers:
        main:
          env:
            CHARGING_UPDATE_INTERVAL_MINUTES: 60
            LEAF_PASSWORD: changeme
            LEAF_TYPE: ''
            LEAF_USERNAME: leafuser
            LOG_LEVEL: Warning
            MQTT_BASE_TOPIC: leaf
            MQTT_HOST: ''
            MQTT_PASSWORD: changeme
            MQTT_PORT: 1883
            MQTT_USERNAME: mqttuser
            UPDATE_INTERVAL_MINUTES: 60
          probes:
            liveness:
              enabled: false
            readiness:
              enabled: false
            startup:
              enabled: false
