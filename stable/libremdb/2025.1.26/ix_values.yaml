image:
  pullPolicy: IfNotPresent
  repository: quay.io/pussthecatorg/libremdb
  tag: latest
persistence:
  config:
    enabled: true
    mountPath: /opt/app
portal:
  open:
    enabled: true
redis:
  enabled: true
  includeCommon: true
  redisUsername: default
service:
  main:
    ports:
      main:
        port: 10593
        protocol: http
        targetPort: 3000
workload:
  main:
    podSpec:
      containers:
        main:
          env:
            AXIOS_ACCEPT: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8
            AXIOS_LANGUAGE: en-US,en;q=0.5
            AXIOS_USERAGENT: Mozilla/5.0 (X11; Linux x86_64; rv:104.0) Gecko/20100101
              Firefox/104.0
            NEXT_PUBLIC_URL: http://localhost:3000
            NEXT_TELEMETRY_DISABLED: 1
            REDIS_URL:
              secretKeyRef:
                expandObjectName: false
                key: url
                name: '{{ printf "%s-%s" .Release.Name "rediscreds" }}'
            USE_REDIS: true
