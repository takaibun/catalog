configmap:
  mkvcleaver:
    data:
      DISPLAY_HEIGHT: '{{ .Values.mkvcleaver.DISPLAY_HEIGHT }}'
      DISPLAY_WIDTH: '{{ .Values.mkvcleaver.DISPLAY_WIDTH }}'
      ENABLE_CJK_FONT: '{{ ternary "1" "0" .Values.mkvcleaver.ENABLE_CJK_FONT }}'
      KEEP_APP_RUNNING: '{{ ternary "1" "0" .Values.mkvcleaver.KEEP_APP_RUNNING }}'
      SECURE_CONNECTION: '{{ ternary "1" "0" .Values.mkvcleaver.SECURE_CONNECTION
        }}'
    enabled: true
image:
  pullPolicy: IfNotPresent
  repository: jlesage/mkvcleaver
  tag: latest
mkvcleaver:
  DISPLAY_HEIGHT: 768
  DISPLAY_WIDTH: 1280
  ENABLE_CJK_FONT: false
  KEEP_APP_RUNNING: false
  SECURE_CONNECTION: false
persistence:
  config:
    enabled: true
    mountPath: /config
  storage:
    enabled: true
    mountPath: /storage
portal:
  open:
    enabled: true
securityContext:
  container:
    capabilities:
      add:
      - CHOWN
      - SETGID
      - SETUID
      - FOWNER
      - DAC_OVERRIDE
      - KILL
      - NET_BIND_SERVICE
      disableS6Caps: true
    readOnlyRootFilesystem: false
    runAsGroup: 0
    runAsNonRoot: false
    runAsUser: 0
service:
  main:
    ports:
      main:
        port: 5800
        targetPort: 5800
        type: tcp
  vnc:
    enabled: true
    ports:
      vnc:
        enabled: true
        port: 5900
        targetPort: 5900
workload:
  main:
    podSpec:
      containers:
        main:
          env:
            VNC_PASSWORD: ''
          envFrom:
          - configMapRef:
              name: mkvcleaver
