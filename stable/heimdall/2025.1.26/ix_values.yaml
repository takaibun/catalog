image:
  pullPolicy: IfNotPresent
  repository: linuxserver/heimdall
  tag: latest
persistence:
  config:
    enabled: true
    mountPath: /config
portal:
  open:
    enabled: true
securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsGroup: 0
    runAsNonRoot: false
    runAsUser: 0
service:
  main:
    ports:
      main:
        port: 10014
        targetPort: 80
workload:
  main:
    podSpec:
      containers:
        main:
          probes:
            startup:
              enabled: true
