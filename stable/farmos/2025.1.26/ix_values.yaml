image:
  pullPolicy: IfNotPresent
  repository: farmos/farmos
  tag: latest
persistence:
  sitesdirectory:
    enabled: true
    mountPath: /var/www/html/sites
portal:
  open:
    enabled: true
securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsGroup: 0
    runAsUser: 0
service:
  main:
    ports:
      main:
        port: 80
        protocol: tcp
        targetPort: 80
