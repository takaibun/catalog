image:
  pullPolicy: IfNotPresent
  repository: docker.io/nodered/node-red
  tag: latest
persistence:
  data:
    enabled: true
    mountPath: /data
portal:
  open:
    enabled: true
service:
  main:
    ports:
      main:
        port: 1880
        targetPort: 1880
workload:
  main:
    podSpec:
      containers:
        main:
          env: {}
