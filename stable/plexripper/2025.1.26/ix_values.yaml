image:
  pullPolicy: IfNotPresent
  repository: plexripper/plexripper
  tag: latest
persistence:
  config:
    enabled: true
    mountPath: /Config
  downloads:
    enabled: true
    mountPath: /Downloads
portal:
  open:
    enabled: true
service:
  main:
    ports:
      main:
        port: 7000
        protocol: http
        targetPort: 7000
workload:
  main:
    podSpec:
      containers:
        main:
          probes:
            liveness:
              enabled: true
              type: http
            readiness:
              enabled: true
              type: http
            startup:
              enabled: true
              type: http
