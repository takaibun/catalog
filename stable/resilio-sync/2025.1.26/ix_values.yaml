image:
  pullPolicy: IfNotPresent
  repository: ghcr.io/linuxserver/resilio-sync
  tag: latest
persistence:
  config:
    enabled: true
    mountPath: /config
  data:
    enabled: true
    mountPath: /sync
  varrun:
    enabled: true
portal:
  open:
    enabled: true
securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsGroup: 0
    runAsNonRoot: false
    runAsUser: 0
service:
  bt-tcp:
    enabled: true
    ports:
      bt-tcp:
        enabled: true
        port: 55555
        targetPort: 55555
  bt-udp:
    enabled: true
    ports:
      bt-udp:
        enabled: true
        port: 55555
        protocol: udp
        targetPort: 55555
  main:
    ports:
      main:
        port: 8888
        targetPort: 8888
workload:
  main:
    podSpec:
      containers:
        main:
          probes:
            liveness:
              port: '{{ .Values.service.main.ports.main.targetPort }}'
              type: tcp
            readiness:
              port: '{{ .Values.service.main.ports.main.targetPort }}'
              type: tcp
            startup:
              port: '{{ .Values.service.main.ports.main.targetPort }}'
              type: tcp
